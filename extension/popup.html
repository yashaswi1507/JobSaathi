<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>JobSaathi AI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0F1E;
      color: #fff;
    }
    .header {
      background: linear-gradient(135deg, #0EA5E9, #7C3AED);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 32px; height: 32px; border-radius: 8px; object-fit:contain; }
    .header-text h1 { font-size: 15px; font-weight: 800; color:#fff; }
    .header-text p  { font-size: 11px; opacity: 0.8; margin-top: 2px; color:#fff; }

    .body { padding: 16px; }

    .status-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px 16px;
      margin-bottom: 14px;
      text-align: center;
    }
    .status-icon { font-size: 32px; margin-bottom: 8px; }
    .status-text { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.5; }

    .score-card {
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: center;
    }
    .score-card.safe   { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); }
    .score-card.medium { background: rgba(245,158,11,0.15);  border: 1px solid rgba(245,158,11,0.3); }
    .score-card.danger { background: rgba(239,68,68,0.15);   border: 1px solid rgba(239,68,68,0.3); }

    .score-num   { font-size: 48px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
    .score-label { font-size: 13px; font-weight: 700; margin-bottom: 8px; }

    .reasons { margin-bottom: 14px; }
    .reason-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 12px;
      color: rgba(255,255,255,0.75);
    }
    .reason-dot { width:6px; height:6px; border-radius:50%; background:#EF4444; margin-top:5px; flex-shrink:0; }

    .llm-explain {
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.25);
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
      font-size:12px;
      color: rgba(255,220,100,0.9);
      line-height:1.6;
    }
    .llm-explain strong { display:block; margin-bottom:4px; font-size:11px; color:#F59E0B; }

    .btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: linear-gradient(135deg, #0EA5E9, #7C3AED); color: #fff; }
    .btn-outline { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); }

    .loading { text-align: center; padding: 24px; }
    .spinner {
      width:32px; height:32px;
      border:3px solid rgba(255,255,255,0.1);
      border-top-color:#0EA5E9;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      margin:0 auto 12px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .backend-error {
      background: rgba(239,68,68,0.1);
      border:1px solid rgba(239,68,68,0.3);
      border-radius:12px;
      padding:16px;
      text-align:center;
      margin-bottom:12px;
    }
    .backend-error .icon { font-size:28px; margin-bottom:8px; }
    .backend-error .title { font-size:13px; font-weight:700; color:#FCA5A5; margin-bottom:6px; }
    .backend-error .desc  { font-size:11px; color:rgba(255,255,255,0.55); line-height:1.6; }

    .footer {
      padding: 10px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
      text-align: center;
      font-size: 10px;
      color: rgba(255,255,255,0.35);
    }
    .footer a { color: #0EA5E9; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="JobSaathi AI"/>
    <div class="header-text">
      <h1>JobSaathi <span style="color:#7FFFEE">AI</span></h1>
      <p>Aapka Career Partner — Job Fraud Detector</p>
    </div>
  </div>

  <div class="body" id="app">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div style="font-size:13px;color:rgba(255,255,255,0.6)">Detecting job page...</div>
    </div>
  </div>

  <div class="footer">
    Powered by <a href="http://localhost:3000" target="_blank">JobSaathi AI</a>
    · <a href="http://localhost:3000/extension-guide" target="_blank">Help</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
