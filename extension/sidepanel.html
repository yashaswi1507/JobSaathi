<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>JobSaathi AI</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0A0F1E;
      color: #fff;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #0EA5E9, #7C3AED);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header img { width:30px; height:30px; border-radius:8px; object-fit:contain; }
    .header h1  { font-size:14px; font-weight:800; color:#fff; }
    .header p   { font-size:10px; color:rgba(255,255,255,0.75); margin-top:1px; }

    /* Auto-detect badge */
    .auto-badge {
      margin-left:auto;
      font-size:10px;
      padding:3px 8px;
      border-radius:20px;
      background:rgba(255,255,255,0.15);
      color:#fff;
      font-weight:600;
    }

    .body { }

    /* Job info bar */
    .job-info {
      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
    }
    .job-title   { font-size:13px; font-weight:700; color:#fff; margin-bottom:3px; }
    .job-company { font-size:11px; color:rgba(255,255,255,0.5); }

    /* Score card */
    .score-card {
      border-radius:12px;
      padding:18px;
      margin-bottom:12px;
      text-align:center;
    }
    .score-card.safe   { background:rgba(16,185,129,0.15); border:1px solid rgba(16,185,129,0.3); }
    .score-card.medium { background:rgba(245,158,11,0.15);  border:1px solid rgba(245,158,11,0.3); }
    .score-card.danger { background:rgba(239,68,68,0.15);   border:1px solid rgba(239,68,68,0.3); }

    .score-num   { font-size:52px; font-weight:900; line-height:1; margin-bottom:4px; }
    .score-label { font-size:14px; font-weight:700; margin-bottom:6px; }
    .score-desc  { font-size:12px; color:rgba(255,255,255,0.6); }

    /* AI Explanation */
    .ai-explain {
      background:rgba(245,158,11,0.08);
      border:1px solid rgba(245,158,11,0.2);
      border-radius:10px;
      padding:12px;
      margin-bottom:12px;
    }
    .ai-explain-title { font-size:11px; font-weight:700; color:#F59E0B; margin-bottom:6px; }
    .ai-explain-text  { font-size:12px; color:rgba(255,220,120,0.9); line-height:1.7; }

    /* Signals */
    .signals-title {
      font-size:11px; font-weight:700;
      color:rgba(255,255,255,0.45);
      text-transform:uppercase; letter-spacing:1px;
      margin-bottom:8px;
    }
    .signal-item {
      display:flex; align-items:flex-start; gap:8px;
      padding:7px 0;
      border-bottom:1px solid rgba(255,255,255,0.05);
      font-size:12px; color:rgba(255,255,255,0.7);
      line-height:1.5;
    }
    .signal-dot {
      width:6px; height:6px; border-radius:50%;
      background:#EF4444; margin-top:5px; flex-shrink:0;
    }
    .signal-dot.ok { background:#10B981; }

    /* Buttons */
    .btn {
      width:100%; padding:10px;
      border:none; border-radius:9px;
      font-size:12px; font-weight:700;
      cursor:pointer; margin-bottom:8px;
      transition:opacity 0.2s;
    }
    .btn:hover { opacity:0.85; }
    .btn-primary { background:linear-gradient(135deg,#0EA5E9,#7C3AED); color:#fff; }
    .btn-outline { background:rgba(255,255,255,0.07); color:#fff; border:1px solid rgba(255,255,255,0.12); }
    .btn-analyze { background:linear-gradient(135deg,#10B981,#0EA5E9); color:#fff; }

    /* Loading */
    .loading { text-align:center; padding:32px 16px; }
    .spinner {
      width:36px; height:36px;
      border:3px solid rgba(255,255,255,0.1);
      border-top-color:#0EA5E9;
      border-radius:50%;
      animation:spin 0.8s linear infinite;
      margin:0 auto 14px;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-text { font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:4px; }
    .loading-sub  { font-size:11px; color:rgba(255,255,255,0.35); }

    /* Error */
    .error-card {
      background:rgba(239,68,68,0.1);
      border:1px solid rgba(239,68,68,0.25);
      border-radius:12px; padding:16px;
      text-align:center; margin-bottom:12px;
    }
    .error-icon  { font-size:28px; margin-bottom:8px; }
    .error-title { font-size:13px; font-weight:700; color:#FCA5A5; margin-bottom:6px; }
    .error-desc  { font-size:11px; color:rgba(255,255,255,0.5); line-height:1.6; }
    .error-desc code { color:#0EA5E9; }

    /* Welcome */
    .welcome { text-align:center; padding:20px 16px; }
    .welcome-icon { font-size:40px; margin-bottom:12px; }
    .welcome-title { font-size:15px; font-weight:700; margin-bottom:8px; }
    .welcome-desc { font-size:12px; color:rgba(255,255,255,0.55); line-height:1.7; margin-bottom:16px; }
    .site-chip {
      display:inline-block; font-size:11px;
      padding:4px 10px; border-radius:20px;
      background:rgba(14,165,233,0.15);
      border:1px solid rgba(14,165,233,0.25);
      color:#7FFFEE; margin:3px;
    }

    .method-badge {
      font-size:10px; color:rgba(255,255,255,0.3);
      text-align:right; margin-bottom:8px;
    }

    .footer {
      padding:10px 14px;
      border-top:1px solid rgba(255,255,255,0.06);
      text-align:center;
      font-size:10px; color:rgba(255,255,255,0.3);
      flex-shrink: 0;
    }
    .footer a { color:#0EA5E9; text-decoration:none; }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="JobSaathi AI"/>
    <div>
      <h1>JobSaathi <span style="color:#7FFFEE">AI</span></h1>
      <p>Job Fraud Detector</p>
    </div>
    <div class="auto-badge" id="autoBadge">🔍 Auto</div>
  </div>

  <div class="body" id="app" style="flex:1; overflow-y:auto; padding:14px;">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">Initializing...</div>
    </div>
  </div>

  <div class="footer">
    <a href="http://localhost:3000" target="_blank">JobSaathi AI Platform</a>
    &nbsp;·&nbsp;
    <a href="http://localhost:3000/extension-guide" target="_blank">Help</a>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
